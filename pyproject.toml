[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "masters-sllms-research"
version = "0.1.0"
description = "Reproducible study of adapted SLMs for offline Android productivity commands"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
training = [
  "torch>=2.6,<3",
  "transformers>=5.3,<6",
  "peft>=0.18,<1",
  "accelerate>=1.4,<2",
  "datasets>=4,<5",
  "safetensors>=0.5,<1",
]
qlora = ["bitsandbytes>=0.45,<1; sys_platform == 'linux'"]
analysis = ["numpy>=2,<3", "pandas>=2.2,<4", "scipy>=1.15,<2", "matplotlib>=3.10,<4"]

[project.scripts]
sllm = "sllm_research.cli:main"
sllm-train = "sllm_research.finetune:main"
sllm-merge = "sllm_research.merge_adapter:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sllm_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".cache", "external", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
