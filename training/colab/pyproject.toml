[project]
name = "sllm-colab-cuda-runtime"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.14.1+cu126",
  "accelerate==1.15.0",
  "transformers==5.20.2",
  "peft==0.21.2",
  "datasets==4.8.5",
  "safetensors==0.8.0",
  "pydantic==2.14.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
qlora = ["bitsandbytes==0.50.2"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.sllm.cuda]
profile = "torch2141-cu126-v1"
torch_version = "2.14.1+cu126"
runtime_version = "12.6"
minimum_linux_driver = "560.28.03"
